<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Something For You</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #080808;
            font-family: Georgia, serif;
        }

        /* Main curtain */
        .curtain {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Left & right curtains */
        .curtain-left,
        .curtain-right {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background:
                repeating-linear-gradient(
                    90deg,
                    #390008 0px,
                    #65000f 18px,
                    #3b0008 36px
                );

            box-shadow:
                inset 0 0 70px rgba(0, 0, 0, 0.7);
            
            transition:
                transform 1.8s cubic-bezier(0.77, 0, 0.18, 1);
        }

        .curtain-left {
            left: 0;
        }

        .curtain-right {
            right: 0;
        }

        /* Curtain opening */
        .curtain.open .curtain-left {
            transform: translateX(-100%);
        }

        .curtain.open .curtain-right {
            transform: translateX(100%);
        }

        /* Dark center shadow */
        .curtain::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                transparent 0%,
                rgba(0, 0, 0, 0.45) 70%,
                rgba(0, 0, 0, 0.85) 100%
            );

            z-index: 2;
            pointer-events: none;
        }

        /* Opening text */
        .intro {
            position: relative;
            z-index: 5;
            text-align: center;
            color: white;

            transition:
                opacity 0.8s ease,
                transform 0.8s ease;
        }

        .intro p {
            font-size: 18px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 35px;
            opacity: 0.85;
        }

        .intro h1 {
            font-size: clamp(35px, 7vw, 75px);
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 45px;
        }

        /* Button */
        .open-btn {
            padding: 15px 42px;
            border: 1px solid rgba(255,255,255,0.7);
            background: transparent;
            color: white;
            font-size: 13px;
            letter-spacing: 5px;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .open-btn:hover {
            background: white;
            color: #240006;
            letter-spacing: 7px;
            transform: scale(1.05);
        }

        /* Hide intro when opening */
        .curtain.open .intro {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        /* Spotlight */
        .spotlight {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(255,255,255,0.08),
                transparent 70%
            );
            z-index: 1;
            pointer-events: none;
        }

        @media (max-width: 600px) {

            .intro p {
                font-size: 12px;
                letter-spacing: 3px;
            }

            .intro h1 {
                font-size: 38px;
            }

            .open-btn {
                padding: 13px 30px;
            }
        }
    </style>
</head>

<body>

    <div class="curtain" id="curtain">

        <div class="spotlight"></div>

        <div class="curtain-left"></div>
        <div class="curtain-right"></div>

        <div class="intro">

            <p>Something I've been wanting to show you</p>

            <h1>For You.</h1>

            <button class="open-btn" onclick="openCurtain()">
                OPEN
            </button>

        </div>

    </div>


    <script>

        function openCurtain() {

            const curtain = document.getElementById("curtain");

            curtain.classList.add("open");

        }

    </script>

</body>
</html>
